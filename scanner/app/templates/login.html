<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner · Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/login">
    <h1>🐋 Pump / Whale Scanner</h1>
    <p class="muted">Sign in to view the dashboard.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label>Username<input name="username" autocomplete="username" autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password"></label>
    <button type="submit">Log in</button>
    <p class="muted small">Set credentials in <code>.env</code>. Analytics only — not financial advice.</p>
  </form>
</body>
</html>
